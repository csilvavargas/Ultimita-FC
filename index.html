<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ultimita">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La Ultimita</title>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(inter-400.woff) format("woff")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(inter-500.woff) format("woff")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(inter-600.woff) format("woff")}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(barlow-condensed-600.woff) format("woff")}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(barlow-condensed-700.woff) format("woff")}
:root{color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#0a5c36;--bg:#f3f8f5;--card:#fff;--ink:#0f2a1c;--mut:#5a7266;--line:#d6e6dc;--acc:#0a5c36;--accx:#fff;--tint:#e3f3e9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06261a;--card:#0c3524;--ink:#eef7f1;--mut:#9cc0ad;--line:#1d5239;--acc:#4fd08a;--accx:#04180f;--tint:#124a31}}
:root[data-theme="dark"]{--bg:#06261a;--card:#0c3524;--ink:#eef7f1;--mut:#9cc0ad;--line:#1d5239;--acc:#4fd08a;--accx:#04180f;--tint:#124a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
h1,h2,nav button,summary{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
h1{margin:0;font-size:26px;line-height:1}
h2{margin:16px 0 8px;font-size:21px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header .t{flex:1}header small{opacity:.85}
.logo{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid #fff}
.hero{width:100%;height:190px;object-fit:cover;object-position:50% 30%;border-radius:12px;display:block}
header select{width:auto;max-width:44vw;background:#fff;color:#0a5c36;border:0;font-weight:600}
main{max-width:720px;margin:auto;padding:12px 16px 88px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:0;background:none;padding:12px 4px;font-size:17px;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
button,select{font:inherit;color:inherit}
select{padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
:is(button,select,summary):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mut{color:var(--mut);font-size:13px;margin:2px 0}
svg.pt{width:100%;height:auto;max-height:68vh;display:block;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mut)}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me,.me{background:var(--tint)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
details.card summary{cursor:pointer;font-size:19px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
details.card[open] summary{margin-bottom:8px}
em{font-style:normal;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut);font-family:Inter,sans-serif;font-weight:500}
.sec[hidden]{display:none}

[hidden]{display:none!important}
header button{border:0;background:#fff;color:#0a5c36;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
header #ed-btn.on{background:#ffd23f;color:#0a2f1c}
.ex select{width:58%}
.row button{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.row button.on,.row button.pri{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.card label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.card input:not([type=checkbox]),.card textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.card textarea{min-height:70px}
label.tick{display:flex;gap:12px;align-items:center;margin:0;padding:11px 8px;border-bottom:1px solid var(--line);font-size:16px;color:var(--ink)}
label.tick input{width:24px;height:24px;accent-color:var(--acc)}
label.tick.me{background:var(--tint)}
.dr{cursor:grab}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#0a2f1c;color:#fff;padding:10px 14px;border-radius:10px;z-index:20}

.row button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
.stp{align-items:center;flex-wrap:nowrap}.stp .mut{flex:1;text-align:center;margin:0}
.stc{font-weight:600;margin:4px 0;min-height:1.2em}
.tags{display:flex;gap:6px;align-items:center}
.pv{min-height:0}
#e-st button{min-width:62px}
#p-instr textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
#p-instr label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.ins-pr{margin:8px 0 12px;padding-left:18px}.ins-pr li{margin:4px 0}
.ins{border-top:1px solid var(--line);padding:8px 0}.ins summary{font-weight:600;cursor:pointer}.ins.me summary{color:var(--acc)}
.ins ul{margin:8px 0 2px;padding-left:18px}.ins li{margin:6px 0}.ins .mom{font-size:12px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}
#p-info label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
#p-info input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
</style>
</head>

function mountPitch(el,p,o={}){

 const near=(x,y,r)=>{let b=null,bd=r;[['A',p.A||[]],['B',p.B||[]]].forEach(([k,L])=>L.forEach((q,i)=>{const dd=Math.hypot(q[0]-x,q[1]-y);if(dd<bd){bd=dd;b=[k,i,q]}}));return b};

  if(mode==='flecha'||mode==='pase'){
   const n=near(x,y,.07),sp=n?n[2]:[x,y];
   p.mv=p.mv||[];d={k:'mv',m:[sp[0],sp[1],x,y,mode==='pase'?'p':'m']};p.mv.push(d.m);s.setPointerCapture(e.pointerId);e.preventDefault();return}

/* ---------- Animación de pasos ---------- */
const ANIM={};
const cancelAnim=id=>{if(ANIM[id]){cancelAnimationFrame(ANIM[id]);delete ANIM[id]}};
const ease=u=>u*u*(3-2*u);
const lerpL=(a,b,u)=>b.map((q,i)=>a[i]?[a[i][0]+(q[0]-a[i][0])*u,a[i][1]+(q[1]-a[i][1])*u]:q);
const mixStep=(a,b,u)=>({A:lerpL(a.A,b.A,u),B:lerpL(a.B||[],b.B||[],u),mv:b.mv||[],ball:a.ball&&b.ball?lerpL([a.ball],[b.ball],u)[0]:(u<.5?a.ball:b.ball)});
function runPlay(p,el,onStep,onDone){
 cancelAnim(el.id);
 const n=p.steps.length,seg=1300,hold=900,t0=performance.now();let last=-1;
 const o={L:p.L,LB:p.LB};
 const tick=now=>{
  const e=now-t0;let k,fr,end=false;
  if(e<hold){k=0;fr=p.steps[0]}
  else{
   const r=e-hold,i=Math.floor(r/(seg+hold))+1;
   if(i>n-1){k=n-1;fr=p.steps[k];end=true}
   else{const l=r-(i-1)*(seg+hold);k=i;fr=l<seg?mixStep(p.steps[i-1],p.steps[i],ease(l/seg)):p.steps[i]}}
  el.innerHTML=svg(fr,o);
  if(k!==last){last=k;onStep&&onStep(k)}
  if(end){delete ANIM[el.id];onDone&&onDone();return}
  ANIM[el.id]=requestAnimationFrame(tick)};
 ANIM[el.id]=requestAnimationFrame(tick)}

<div class="row"><button data-a="cf">Borrar flechas</button>${EK>0?'<button data-a="auto">Flechas desde el paso anterior</button>':''}${EP.steps.length>1?'<button data-a="dp">Eliminar paso</button><button data-a="pl">Reproducir</button>':''}</div>
<div class="row"><button class="pri" data-a="ok">Listo</button><button data-a="del">Eliminar jugada</button></div>`;
 mountEdPitch()}
function mountEdPitch(){
 const o={mode:EO.mode,drag:['A','B','ball'],onChange:save,
  onDelete:(k,i)=>{
   if(k==='A'){ensureL();EP.L.splice(i,1)}else{ensureLB();EP.LB.splice(i,1)}
   EP.steps.forEach(q=>q[k].splice(i,1))},
  onLabel:(k,i,done)=>{
   const cur=k==='A'?((EP.L&&EP.L[i])||defLab(i)):((EP.LB&&EP.LB[i])||defLabB(i));
   const v=prompt('Etiqueta de la ficha (máx. 4 letras):',cur);if(v===null)return;
   if(k==='A'){ensureL();EP.L[i]=v.trim().slice(0,4)||defLab(i)}else{ensureLB();EP.LB[i]=v.trim().slice(0,4)||defLabB(i)}
   done()}};
 Object.defineProperty(o,'L',{get:()=>EP&&EP.L,enumerable:true});
 Object.defineProperty(o,'LB',{get:()=>EP&&EP.LB,enumerable:true});
 mountPitch($('e-p'),EP.steps[EK],o)}
$('j-edit').oninput=e=>{
 if(!EP)return;
 if(e.target.id==='e-t')EP.t=e.target.value;
 if(e.target.id==='e-d')EP.d=e.target.value;
 if(e.target.id==='e-n')EP.steps[EK].n=e.target.value;
 save()};
$('j-edit').onchange=e=>{if(EP&&e.target.id==='e-c'){EP.c=e.target.value;save()}};
$('j-edit').onclick=e=>{
 const b=e.target.closest('button');if(!b||!EP)return;
 cancelAnim('e-p');
 const cur=EP.steps[EK];
 if(b.dataset.k!==undefined){EK=+b.dataset.k;rEd();return}
 if(b.dataset.m){EO.mode=b.dataset.m;document.querySelectorAll('#e-m button').forEach(x=>x.classList.toggle('on',x===b));$('e-h').textContent=HINT[EO.mode];mountEdPitch();return}
 const a=b.dataset.a;
 if(a==='ok'){delete EP.b;save();JC=EP.c;document.querySelectorAll('[data-j]').forEach(x=>x.classList.toggle('on',x.dataset.j===JC));closeEd();return}
 if(a==='del'){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='Toca de nuevo para eliminar';return}
  S.jugadas=S.jugadas.filter(p=>p!==EP);save();closeEd();return}
 if(a==='dp'){
  if(!b.dataset.s){b.dataset.s=1;b.textContent='Toca de nuevo para eliminar el paso';return}
  EP.steps.splice(EK,1);EK=Math.max(0,EK-1);save();rEd();return}
 if(a==='np'){EP.steps.splice(EK+1,0,{A:clone(cur.A),B:clone(cur.B||[]),mv:[],ball:cur.ball?clone(cur.ball):null,n:''});EK++;save();rEd();return}
 if(a==='pl'){
  runPlay(EP,$('e-p'),k=>{const h=$('e-h');if(h)h.textContent=`Reproduciendo: paso ${k+1} de ${EP.steps.length}${EP.steps[k].n?' · '+EP.steps[k].n:''}`},()=>{$('e-h').textContent=HINT[EO.mode];mountEdPitch()});return}
 if(a==='aj'){if(EP.L)EP.L.push(String(EP.steps[0].A.length+1));EP.steps.forEach(q=>q.A.push([.5,.6]))}
 if(a==='ar'){if(EP.LB)EP.LB.push(String((EP.steps[0].B||[]).length+1));EP.steps.forEach(q=>(q.B=q.B||[]).push([.5,.3]))}
 if(a==='ba')cur.ball=cur.ball?null:[.5,.5];
 if(a==='of')OF.forEach((q,i)=>{if(cur.A[i])cur.A[i]=[...q]});
 if(a==='df')DF.forEach((q,i)=>{if(cur.A[i])cur.A[i]=[...q]});
 if(a==='cf')cur.mv=[];
 if(a==='auto'&&EK>0){const pv=EP.steps[EK-1];cur.mv=cur.mv.filter(m=>m[4]==='p').concat(mvs(pv.A,cur.A),mvs(pv.B||[],cur.B||[]))}
 save();mountEdPitch()};

/* ---------- Navegación ---------- */
function chips(sel,attr,fn){document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{document.querySelectorAll(sel).forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset[attr])})}
chips('[data-m].chip','m',v=>{M=v;rPartido()});
chips('[data-a].chip','a',v=>{AF=v;rResumen()});
chips('[data-j]','j',v=>{JC=v;if(EP)closeEd();else rJug()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.sec').forEach(s=>s.hidden=s.id!=='s-'+b.dataset.s);scrollTo(0,0)});
const renderAll=()=>{rPartido();rTabla();rAsist();rJug()};
$('rv').hidden=!fin.esq;
$('rv').onclick=e=>{RV=!RV;e.target.classList.toggle('on',RV);rPartido()};
const sync=()=>{$('ed-btn').hidden=!ED};
$('ed-btn').onclick=()=>{
 EDIT=!EDIT;$('ed-btn').classList.toggle('on',EDIT);$('ed-btn').textContent=EDIT?'Editando':'Editar';
 if(!EDIT&&EP){cancelAnim('e-p');EP=null;$('j-edit').hidden=true}
 renderAll()};
renderAll();
function dataset(){return{liga,jug,fin:{...fin,asig:S.asig},tabla,fix,asig:S.asig,rv:S.rv,pos:S.pos,asist:S.asist,jugadas:S.jugadas}}
function aplicar(d){
 if(d.liga)liga=d.liga;if(d.jug)jug=d.jug;if(d.fin)fin=d.fin;if(d.tabla)tabla=d.tabla;if(d.fix)fix=d.fix;
 if(d.asig)S.asig=d.asig;else if(d.fin&&d.fin.asig)S.asig={...d.fin.asig};
 if('rv' in d)S.rv=d.rv;
 if(d.pos)S.pos={of:d.pos.of||null,df:d.pos.df||null};
 if(d.asist)S.asist=d.asist;
 if(d.jugadas)S.jugadas=d.jugadas.map(norm)}
function rYo(){$('yo').innerHTML=roleOpts();$('yo').value=yo}
function estado(){$('pub-st').textContent=DIRTY?'Hay cambios sin publicar en este teléfono.':'Sin cambios pendientes.'}
const CFG=()=>{try{return JSON.parse(localStorage.getItem('ult_gh')||'{}')}catch(e){return{}}};
async function publicar(){
 const c=CFG();
 if(!c.repo||!c.token){flash('Primero toca Configurar GitHub.');return}
 const url=`https://api.github.com/repos/${c.repo}/contents/data.json`,br=c.branch||'main',h={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
 try{
  const g=await fetch(url+'?ref='+br,{headers:h});let sha;
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status);
  const body=btoa(unescape(encodeURIComponent(JSON.stringify(dataset(),null,1))));
  const r=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message:'Actualiza datos de la app',content:body,sha,branch:br})});
  if(!r.ok)throw new Error(r.status);
  try{localStorage.removeItem('ult_local')}catch(e){}
  DIRTY=false;estado();flash('Publicado. Los jugadores lo verán en 1 o 2 minutos.')
 }catch(e){flash('No se pudo publicar (código '+e.message+'). Revisa repositorio y token.')}}
async function exportar(){
 const f=new File([JSON.stringify(dataset(),null,1)],'data.json',{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Datos La Ultimita'});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='data.json';a.click()}
$('pb-pub').onclick=publicar;
$('pb-exp').onclick=exportar;
$('pb-cfg').onclick=()=>{
 const c=CFG(),repo=prompt('Repositorio de GitHub (usuario/nombre):',c.repo||'');if(repo===null)return;
 const token=prompt('Token de acceso (permiso Contents: Read and write):',c.token||'');if(token===null)return;
 try{localStorage.setItem('ult_gh',JSON.stringify({repo:repo.trim(),token:token.trim(),branch:c.branch||'main'}))}catch(e){}
 flash('Configuración guardada en este teléfono.')};
$('pb-dis').onclick=()=>{
 if(!$('pb-dis').dataset.s){$('pb-dis').dataset.s=1;$('pb-dis').textContent='Toca de nuevo para descartar';return}
 try{localStorage.removeItem('ult_local')}catch(e){}
 location.reload()};
const _ed=$('ed-btn').onclick;
$('ed-btn').onclick=()=>{_ed();$('pub').hidden=!EDIT;estado()};
(async()=>{
 try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)aplicar(await r.json())}catch(e){}
 if(ED){try{const l=JSON.parse(localStorage.getItem('ult_local')||'null');if(l){aplicar(l);DIRTY=true}}catch(e){}}
 rYo();$('rv').hidden=!fin.esq;renderAll();sync();estado();if(ED&&!EDIT)$('ed-btn').click()})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
